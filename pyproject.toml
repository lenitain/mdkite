[project]
name = "mdkite"
description = "Render one Markdown file in the browser"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = []
version = "0.2.0"

[project.scripts]
mdkite = "mdkite.cli:main"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
